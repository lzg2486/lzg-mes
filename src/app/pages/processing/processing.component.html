<!-- 顶部 -->
<div style="margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-shrink:0;">
  <nz-button-group>
    <button nz-button nzType="primary">
      <i class="anticon anticon-appstore"></i> 布局
    </button>
  </nz-button-group>

  <!-- 操作模式切换 -->
  <nz-radio-group [(ngModel)]="viewMode" nzButtonStyle="solid" style="margin-left:8px;">
    <label nz-radio-button nzValue="card"><i class="anticon anticon-table"></i> 卡片视图</label>
    <label nz-radio-button nzValue="pull"><i class="anticon anticon-rocket"></i> 拉动式</label>
    <label nz-radio-button nzValue="process"><span style="font-weight:600;">生产加工</span></label>
  </nz-radio-group>

  <div style="flex:1;"></div>
  <i class="anticon anticon-down-circle-o" style="font-size:18px;color:#999;cursor:pointer;"></i>
</div>

<!-- 搜索栏 -->
<div class="search-bar" style="flex-shrink:0;">
  <div style="display:flex;align-items:center;gap:12px;">
    <i class="anticon anticon-search-circle-o" style="color:#1890ff;font-size:18px;margin-right:4px;"></i>
    <span>生产订单：</span>
    <input nz-input placeholder="生产订单（批量、模糊）" [(ngModel)]="searchOrderNo" style="width:220px;" />
    <span style="margin-left:8px;">物料号：</span>
    <input nz-input placeholder="物料号" [(ngModel)]="searchMaterialNo" style="width:180px;" />
    <button nz-button nzType="primary"><i class="anticon anticon-search"></i> 搜索</button>
  </div>
</div>

<!-- 表格 -->
<div class="table-card">
  <nz-table #procTable [nzData]="listOfData"
    nzSize="small"
    [nzBordered]="false"
    [nzShowPagination]="false"
    [nzScroll]="{ x: '1050px', y: 'calc(100vh - 280px)' }">

    <thead>
      <tr>
        <th nzLeft nzWidth="60px" nzAlign="center">
          <label nz-checkbox [(ngModel)]="checked"
            [nzIndeterminate]="indeterminate"
            (ngModelChange)="onAllChecked($event)"></label>
        </th>
        <th nzLeft nzWidth="60px" nzAlign="center">序号</th>
        <th nzWidth="140px">派工单编号 <sup style="color:#ff4d4f;">7</sup> <i class="anticon anticon-arrow-down"></i></th>
        <th nzWidth="140px">工单编号 <i class="anticon anticon-arrow-down"></i></th>
        <th nzWidth="80px">工序</th>
        <th nzWidth="130px">实动定额百分比</th>
        <th nzWidth="180px">物料描述</th>
        <th nzWidth="80px">顺序编号 <i class="anticon anticon-arrow-down"></i></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of procTable.data; let i = index">
        <td nzLeft nzAlign="center">
          <label nz-checkbox [(ngModel)]="data.checked"
            (ngModelChange)="onItemChecked(data.id, $event)"></label>
        </td>
        <td nzLeft nzAlign="center">{{ i + 1 }}</td>
        <td><a style="color:#1890ff;">{{ data.dispatchNo }}</a></td>
        <td><a style="color:#1890ff;">{{ data.workNo }}</a></td>
        <td>{{ data.processCode }}</td>
        <td>
          <div *ngIf="getProgressValue(data.actualPercent) > 0">
            <nz-progress
              [nzPercent]="getProgressValue(data.actualPercent)"
              [nzStrokeWidth]="6"
              [nzSize]="'small'"
              [nzStatus]="'active'"
              [nzShowInfo]="false">
            </nz-progress>
          </div>
          <span *ngIf="getProgressValue(data.actualPercent) === 0">{{ data.actualPercent }}</span>
        </td>
        <td>{{ data.materialDesc }}</td>
        <td>{{ data.seqNo }}</td>
      </tr>
    </tbody>
  </nz-table>
</div>

<!-- 底部操作+分页栏 -->
<div class="page-footer">
  <div class="footer-left">
    <button nz-button nzType="primary" size="small"><i nz-icon nzType="play-circle"></i> 开工</button>
    <button nz-button size="small"><i nz-icon nzType="pause-circle"></i> 暂停</button>
    <button nz-button size="small"><i nz-icon nzType="clock-circle"></i> 等工</button>
    <button nz-button size="small"><i nz-icon nzType="check-circle"></i> 完成</button>
    <button nz-button size="small">更多 <i nz-icon nzType="down"></i></button>
  </div>
  <div class="footer-right">
    共 52 项
    <nz-pagination
      [nzPageIndex]="1"
      [nzTotal]="52"
      [nzPageSize]="50"
      nzSize="small"
      [nzShowSizeChanger]="true"
      [nzShowQuickJumper]="true">
    </nz-pagination>
  </div>
</div>
