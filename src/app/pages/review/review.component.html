<!-- 顶部 -->
<div style="margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-shrink:0;">
  <nz-button-group>
    <button nz-button nzType="primary">
      <i class="anticon anticon-appstore"></i> 布局
    </button>
  </nz-button-group>

  <!-- 面包屑 -->
  <nz-breadcrumb [nzSeparator]="'>'">
    <nz-breadcrumb-item>完工处理</nz-breadcrumb-item>
    <nz-breadcrumb-item>工单审核</nz-breadcrumb-item>
  </nz-breadcrumb>

  <div style="flex:1;"></div>
  <i class="anticon anticon-down-circle-o" style="font-size:18px;color:#999;cursor:pointer;"></i>
</div>

<!-- 搜索栏 -->
<div class="search-bar" style="flex-shrink:0;">
  <div style="display:flex;align-items:center;gap:12px;">
    <i class="anticon anticon-search-circle-o" style="color:#1890ff;font-size:18px;margin-right:4px;"></i>
    <span>生产订单：</span>
    <input nz-input placeholder="生产订单（批量）" [(ngModel)]="searchOrderNo" style="width:200px;" />
    <span style="margin-left:8px;">物料：</span>
    <input nz-input placeholder="物料" [(ngModel)]="searchMaterial" style="width:200px;" />
    <button nz-button nzType="primary"><i class="anticon anticon-search"></i> 搜索</button>
  </div>
</div>

<!-- 表格 -->
<div class="table-card">
  <nz-table #reviewTable [nzData]="listOfData"
    nzSize="small"
    [nzBordered]="false"
    [nzShowPagination]="false"
    [nzScroll]="{ x: '1100px', y: 'calc(100vh - 280px)' }">

    <thead>
      <tr>
        <th nzLeft nzWidth="60px" nzAlign="center">
          <label nz-checkbox [(ngModel)]="checked"
            [nzIndeterminate]="indeterminate"
            (ngModelChange)="onAllChecked($event)"></label>
        </th>
        <th nzLeft nzWidth="60px" nzAlign="center">序号</th>
        <th nzWidth="120px">派工单号</th>
        <th nzWidth="90px" nzAlign="center">报工数量</th>
        <th nzWidth="130px">加工编号 1 <i class="anticon anticon-arrow-up"></i></th>
        <th nzWidth="130px">审核编号 <i class="anticon anticon-arrow-up"></i></th>
        <th nzWidth="140px">实动定额百分比</th>
        <th nzWidth="60px" nzAlign="center">需质检</th>
        <th nzWidth="60px" nzAlign="center">已质检</th>
        <th nzWidth="130px">生产订单</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of reviewTable.data; let i = index">
        <td nzLeft nzAlign="center">
          <label nz-checkbox [(ngModel)]="data.checked"
            (ngModelChange)="onItemChecked(data.id, $event)"></label>
        </td>
        <td nzLeft nzAlign="center">{{ i + 1 }}<sup *ngIf="i < 3" style="color:#ff4d4f;">*</sup></td>
        <td>{{ data.dispatchNo }}</td>
        <td nzAlign="center">{{ data.reportQty }}</td>
        <td><a style="color:#1890ff;">{{ data.processNo1 }}</a></td>
        <td><a style="color:#1890ff;">{{ data.reviewNo }}</a></td>
        <td>
          <nz-progress
            [nzPercent]="$any(data.actualPercent) || 0"
            [nzStrokeWidth]="8"
            [nzSize]="'small'"
            [nzStatus]="$any(data.actualPercent) > 0 ? 'active' : 'normal'"
            [nzShowInfo]="true">
          </nz-progress>
        </td>
        <td nzAlign="center"><i *ngIf="data.needQc" class="anticon anticon-check" style="color:#52c41a;"></i></td>
        <td nzAlign="center"><i *ngIf="data.qcDone" class="anticon anticon-check" style="color:#52c41a;"></i></td>
        <td><a style="color:#1890ff;">{{ data.productionOrder }}</a></td>
      </tr>
    </tbody>
  </nz-table>
</div>

<!-- 底部操作+分页栏 -->
<div class="page-footer">
  <div class="footer-left">
    <button nz-button size="small"><i nz-icon nzType="edit"></i> 调整</button>
    <button nz-button size="small"><i nz-icon nzType="safety-certificate"></i> 审核</button>
    <button nz-button size="small"><i nz-icon nzType="safety"></i> 审核（全检）</button>
    <button nz-button size="small"><i nz-icon nzType="download"></i> 下载</button>
  </div>
  <div class="footer-right">
    共 1564 项
    <nz-pagination
      [nzPageIndex]="1"
      [nzTotal]="1564"
      [nzPageSize]="50"
      nzSize="small"
      [nzShowSizeChanger]="true"
      [nzShowQuickJumper]="true">
    </nz-pagination>
  </div>
</div>
