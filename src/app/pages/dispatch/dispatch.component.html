<!-- 顶部 -->
<div style="margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-shrink:0;">
  <nz-button-group>
    <button nz-button nzType="primary">
      <i class="anticon anticon-appstore"></i> 布局
    </button>
  </nz-button-group>

  <!-- 面包屑 -->
  <nz-breadcrumb [nzSeparator]="'>'">
    <nz-breadcrumb-item>生产派工</nz-breadcrumb-item>
    <nz-breadcrumb-item>派工管理</nz-breadcrumb-item>
  </nz-breadcrumb>

  <div style="flex:1;"></div>
  <i class="anticon anticon-down-circle-o" style="font-size:18px;color:#999;cursor:pointer;"></i>
</div>

<!-- 错误提示条 -->
<nz-alert
  nzType="error"
  [nzMessage]="'分页查询派工单失败。null'"
  nzShowIcon
  nzClosable
  style="margin-bottom:12px;flex-shrink:0;">
</nz-alert>

<!-- 搜索栏 -->
<div class="search-bar" style="flex-shrink:0;">
  <div style="display:flex;align-items:center;gap:12px;">
    <i class="anticon anticon-search-circle-o" style="color:#1890ff;font-size:18px;margin-right:4px;"></i>
    <span>生产订单：</span>
    <input nz-input placeholder="生产订单（批量、模糊）" [(ngModel)]="searchOrderNo" style="width:220px;" />
    <span style="margin-left:8px;">物料号：</span>
    <input nz-input placeholder="物料号（批量、模糊）" [(ngModel)]="searchMaterialNo" style="width:220px;" />
    <button nz-button nzType="primary"><i class="anticon anticon-search"></i> 搜索</button>
  </div>
</div>

<!-- 表格 -->
<div class="table-card">
  <nz-table #dispatchTable [nzData]="listOfData"
    nzSize="small"
    [nzBordered]="false"
    [nzShowPagination]="false"
    [nzScroll]="{ x: '1200px', y: 'calc(100vh - 320px)' }">

    <thead>
      <tr>
        <th nzLeft nzWidth="60px" nzAlign="center">
          <label nz-checkbox [(ngModel)]="checked"
            [nzIndeterminate]="indeterminate"
            (ngModelChange)="onAllChecked($event)"></label>
        </th>
        <th nzLeft nzWidth="60px" nzAlign="center">序号</th>
        <th nzWidth="130px">工单编号 <i class="anticon anticon-arrow-down"></i></th>
        <th nzWidth="150px">直接派工单号 <i class="anticon anticon-arrow-down"></i><sup style="color:#ff4d4f;">1</sup></th>
        <th nzWidth="140px">生产订单 <i class="anticon anticon-arrow-up"></i></th>
        <th nzWidth="200px">派工人员</th>
        <th nzWidth="80px" nzAlign="center">工单数量</th>
        <th nzWidth="80px" nzAlign="center">报废待扣</th>
        <th nzWidth="80px" nzAlign="center">加工状态</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of dispatchTable.data; let i = index">
        <td nzLeft nzAlign="center">
          <label nz-checkbox [(ngModel)]="data.checked"
            (ngModelChange)="onItemChecked(data.id, $event)"></label>
        </td>
        <td nzLeft nzAlign="center">{{ i + 1 }}</td>
        <td><a style="color:#1890ff;">{{ data.dispatchNo }}</a></td>
        <td><a style="color:#1890ff;">{{ data.directDispatchNo }}</a></td>
        <td><a style="color:#1890ff;">{{ data.productionOrder }}</a></td>
        <td>
          <a style="color:#1890ff;">{{ data.worker }}</a>
          <i class="anticon anticon-export" style="color:#1890ff;margin-left:4px;font-size:12px;"></i>
        </td>
        <td nzAlign="center">{{ data.quantity }}</td>
        <td nzAlign="center">
          <label nz-switch [(ngModel)]="data.scrapPending" nzCheckedChildren="已挂" nzUnCheckedChildren="已挂"></label>
        </td>
        <td nzAlign="center" [style.color]="data.statusColor">{{ data.status }}</td>
      </tr>
    </tbody>
  </nz-table>
</div>

<!-- 底部操作+分页栏 -->
<div class="page-footer">
  <div class="footer-left">
    <button nz-button size="small">下发</button>
    <button nz-button size="small">更多</button>
  </div>
  <div class="footer-right">
    共 1384 项
    <nz-pagination
      [nzPageIndex]="1"
      [nzTotal]="1384"
      [nzPageSize]="50"
      nzSize="small"
      [nzShowSizeChanger]="true"
      [nzShowQuickJumper]="true">
    </nz-pagination>
  </div>
</div>
