<!-- 顶部Tab切换 -->
<div style="margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-shrink:0;">
  <nz-button-group>
    <button nz-button nzType="primary">
      <i class="anticon anticon-appstore"></i> 布局
    </button>
  </nz-button-group>

  <!-- 面包屑 -->
  <nz-breadcrumb [nzSeparator]="'>'">
    <nz-breadcrumb-item>生产派工</nz-breadcrumb-item>
    <nz-breadcrumb-item>工单生成</nz-breadcrumb-item>
  </nz-breadcrumb>

  <div style="flex:1;"></div>

  <!-- 视图切换 Tab -->
  <nz-radio-group [(ngModel)]="activeView" nzButtonStyle="solid" style="margin-right:12px;">
    <label nzRadioButton value="order">订单视图</label>
    <label nzRadioButton value="process">工序视图</label>
  </nz-radio-group>

  <i class="anticon anticon-down-circle-o" style="font-size:18px;color:#999;cursor:pointer;"></i>
</div>

<!-- 搜索栏 -->
<div class="search-bar" style="flex-shrink:0;">
  <div style="display:flex;align-items:center;gap:12px;">
    <i class="anticon anticon-search-circle-o" style="color:#1890ff;font-size:18px;margin-right:4px;"></i>
    <span>生产订单：</span>
    <input nz-input placeholder="生产订单（批量、模糊）" [(ngModel)]="searchOrderNo" style="width:220px;" />
    <span style="margin-left:8px;">物料号：</span>
    <input nz-input placeholder="物料号（批量、模糊）" [(ngModel)]="searchMaterialNo" style="width:220px;" />
    <button nz-button nzType="primary"><i class="anticon anticon-search"></i> 搜索</button>
  </div>
</div>

<!-- 表格 -->
<div class="table-card">
  <nz-table #workTable [nzData]="listOfData"
    nzSize="small"
    [nzBordered]="false"
    [nzShowPagination]="false"
    [nzScroll]="{ x: '1100px', y: 'calc(100vh - 280px)' }">

    <thead>
      <tr>
        <th nzLeft nzWidth="60px" nzAlign="center">
          <label nz-checkbox [(ngModel)]="checked"
            [nzIndeterminate]="indeterminate"
            (ngModelChange)="onAllChecked($event)"></label>
        </th>
        <th nzLeft nzWidth="60px" nzAlign="center">序号</th>
        <th nzWidth="150px">生产工单号 <i class="anticon anticon-arrow-down"></i></th>
        <th nzWidth="150px">物料号 <i class="anticon anticon-arrow-up"></i></th>
        <th nzWidth="120px">图号</th>
        <th nzWidth="180px">物料描述</th>
        <th nzWidth="70px" nzAlign="center">数量</th>
        <th nzWidth="70px" nzAlign="center">计划员</th>
        <th nzWidth="70px" nzAlign="center">调度员</th>
        <th nzWidth="80px" nzAlign="center">生产工厂</th>
        <th nzWidth="120px">WBS元素</th>
        <th nzWidth="60px" nzAlign="center">开关</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of workTable.data; let i = index">
        <td nzLeft nzAlign="center">
          <label nz-checkbox [(ngModel)]="data.checked"
            (ngModelChange)="onItemChecked(data.id, $event)"></label>
        </td>
        <td nzLeft nzAlign="center">{{ i + 1 }}</td>
        <td><a style="color:#1890ff;">{{ data.workNo }}</a></td>
        <td>{{ data.materialNo }}</td>
        <td>{{ data.drawingNo }}</td>
        <td>{{ data.materialDesc }}</td>
        <td nzAlign="center">{{ data.quantity }}</td>
        <td nzAlign="center">{{ data.planner }}</td>
        <td nzAlign="center">{{ data.dispatcher || '-' }}</td>
        <td nzAlign="center">{{ data.factory }}</td>
        <td>{{ data.wbsElement }}</td>
        <td nzAlign="center">
          <label nz-switch [(ngModel)]="data.switchOn"></label>
        </td>
      </tr>
    </tbody>
  </nz-table>
</div>

<!-- 底部操作+分页栏 -->
<div class="page-footer">
  <div class="footer-left">
    <button nz-button size="small"><i nz-icon nzType="double-left"></i> 工序列表</button>
    <button nz-button size="small"><i nz-icon nzType="double-right"></i> 工序列表</button>
  </div>
  <div class="footer-right">
    共 144 项
    <nz-pagination
      [nzPageIndex]="1"
      [nzTotal]="144"
      [nzPageSize]="50"
      nzSize="small"
      [nzShowSizeChanger]="true"
      [nzShowQuickJumper]="true">
    </nz-pagination>
  </div>
</div>
